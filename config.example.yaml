# Station Agent - příklad konfigurace.
# Zkopíruj jako config.yaml a uprav. Bezpečnostně kritické výchozí hodnoty
# (rig.mode: mock, web.host: 127.0.0.1) NEMĚŇ, pokud přesně nevíš, co děláš
# -- viz AGENTS.md.

station:
  callsign: "OK1EXAMPLE"
  # QTH lze zadat buď jako Maidenhead locator, nebo přímo lat/lon (stupně).
  # Pokud je locator vyplněný, má přednost.
  qth_locator: "JN79FG"
  latitude: null
  longitude: null

rig:
  # mock = žádné reálné spojení s rádiem (výchozí, bezpečné pro testy/vývoj)
  # live = reálné TCP spojení na rigctld -- explicitní volba uživatele
  mode: mock
  rigctld_host: "127.0.0.1"
  rigctld_port: 4532
  model: "IC-7300"

# Povolená pásma pro zobrazení kandidátů a AUTO TUNE.
bands:
  - "160m"
  - "80m"
  - "60m"
  - "40m"
  - "30m"
  - "20m"
  - "17m"
  - "15m"
  - "12m"
  - "10m"
  - "6m"

# Povolené módy pro zobrazení kandidátů a AUTO TUNE.
modes:
  - "SSB"
  - "FT8"
  - "FT4"
  - "CW"
  - "RTTY"
  - "PSK31"
  - "PSK63"
  - "OTHER_DIGITAL"

scoring:
  min_score: 60
  # Spoty starší než tento počet minut se do scoringu nezapočítávají.
  spot_max_age_minutes: 15
  # Váhy jednotlivých faktorů skóre (musí dát dohromady 100).
  weights:
    freshness: 15
    sources: 15
    needed_dxcc: 25
    signal: 10
    # Kolik nezávislých spotterů/skimmerů stanici potvrdilo.
    reliability: 10
    # Hodinový výhled pro pásmo z aktuálního NOAA Kp/SFI, QTH lokátoru a
    # lokálního slunečního času; při nedostupnosti fallback na aktivitu spotů.
    propagation: 15
    # Vzdálenost od nakonfigurovaného QTH (dál = víc "DX").
    path_dx: 10

autotune:
  enabled: false
  # HOLD: když je true, AUTO TUNE nikdy nepřeladí (ruční pauza operátora).
  hold: false
  # Minimální doba (s), po kterou musí rig zůstat na aktuální stanici,
  # než se vůbec zvažuje přeladění.
  min_hold_seconds: 120
  # Nový kandidát musí mít skóre minimálně o tolik bodů vyšší než aktuální
  # stanice, jinak se nepřelaďuje (zabraňuje "cukání" mezi podobnými spoty).
  min_score_delta: 8

sources:
  mock:
    enabled: true
  dx_cluster:
    # Živě funkční adaptér (telnet: TCP spojení, login callsignem, čtení a
    # parsování řádků) -- viz README "Stav externích zdrojů". GUI během
    # startovní grace period hlásí "pending"; potom "ok"/"error" podle
    # aktuálního stavu přihlášeného spojení.
    # Je defaultně vypnutý, aby example config bez výslovné volby uživatele
    # a jeho skutečného callsignu nevytvářel externí síťová spojení. Vyber si
    # geograficky bližší veřejný cluster, pokud chceš nižší latenci spotů.
    enabled: false
    host: "dxc.w3lpl.net"
    port: 7373
    # První 3 minuty je stav "pending", aby měl telnet zdroj čas na rozběh.
    # startup_grace_seconds: 180
    # Volitelně jiný callsign pro přihlášení než station.callsign výše.
    # callsign: "OK1EXAMPLE"
  rbn:
    # Živě funkční adaptér (telnet.reversebeacon.net) -- stejný princip
    # jako dx_cluster výše, viz README "Stav externích zdrojů".
    enabled: false
    host: "telnet.reversebeacon.net"
    port: 7000
    # startup_grace_seconds: 180
  pskreporter:
    # Živě funkční adaptér (HTTP GET + XML) -- viz README "Stav externích
    # zdrojů". I tak je defaultně vypnutý: live zdroje vyžadují explicitní
    # volbu uživatele (viz AGENTS.md pravidlo 4).
    enabled: false
    query_url: "https://retrieve.pskreporter.info/query"
    # Volitelné další query parametry (např. senderCallsign, flowStartSeconds)
    # -- viz https://www.pskreporter.info/pskdev.html
    # timeout_s: 15

  # Ověřené veřejné alternativy s běžnými DX spoty včetně SSB. Jsou vypnuté
  # ze stejného důvodu jako primární uzel: uživatel musí zvolit callsign a
  # endpointy výslovně zapnout. Další uzly
  # pojmenuj prefixem "dx_cluster_". Počet není omezený a každý uzel má
  # vlastní spojení, frontu i stav; jméno se zachová jako identita zdroje.
  # Zdroje endpointů jsou uvedené v README.
  dx_cluster_hamserve:
    enabled: false
    host: "dxc.hamserve.uk"
    port: 7300
  dx_cluster_ea7jxh:
    enabled: false
    host: "dx.ea7jxh.eu"
    port: 7300
  dx_cluster_m0mhx:
    enabled: false
    host: "dxc.m0mhx.uk"
    port: 7300

log4om:
  # Log4OM2 integrace pouze PŘEDVYPLŇUJE řádek v deníku, nikdy neukládá QSO
  # automaticky. Payload je implementovaný a otestovaný, odeslání na živou
  # instanci Log4OM2 je označené jako pending verifikace (viz README).
  enabled: false
  host: "127.0.0.1"
  port: 2333

web:
  # MUSÍ zůstat loopback adresa -- server.py to i tvrdě vynucuje v kódu.
  host: "127.0.0.1"
  port: 8765

database:
  path: "station_agent.sqlite3"

polling:
  # Minimální doba (s) mezi dvěma reálnými dotazy na TENTÝŽ živý zdroj
  # (např. PSKReporter). Je záměrně oddělená od frekvence obnovování GUI
  # (to se obnovuje z DB každých pár sekund bez ohledu na tuto hodnotu) --
  # nesnižuj pod 60, jinak riskuješ HTTP 429 Too Many Requests. PSKReporter
  # si navíc vynucuje vlastní ještě přísnější minimum (300 s, viz
  # PSKReporterAdapter.min_poll_interval_seconds) -- tuto hodnotu níž
  # nezvedneš.
  source_interval_seconds: 60
  # Horní strop pro exponenciální backoff po opakovaných HTTP 429 odpovědích.
  source_backoff_max_seconds: 1800

propagation:
  # Nejvýše jednou za hodinu načte aktuální Kp a SFI z NOAA SWPC a připraví
  # transparentní výhled pro jednotlivá pásma vzhledem ke station.qth_locator.
  enabled: true
  refresh_seconds: 3600

qrz:
  # Obecný (ne hard-coded pro konkrétní prefix) síťový fallback pro
  # zemi/DXCC, když ji offline PREFIX_TABLE (station_agent/dxcc.py) pro
  # daný callsign nenajde -- viz DIAGNOSIS_DXCC_PREFIX_GAP.md. Nikdy
  # nepřepisuje offline výsledek ani hodnotu dodanou zdrojem spotu, jen
  # doplňuje to, co by jinak v GUI zůstalo jako "?".
  # Defaultně vypnuto -- vyžaduje vlastní QRZ.com XML Subscription účet
  # (https://www.qrz.com/XML/current_spec.html), ne sdílené/vestavěné
  # přihlašovací údaje (viz AGENTS.md pravidlo 6).
  enabled: false
  username: ""
  password: ""
  # timeout_s: 10
  # Jak dlouho se výsledek vyhledání (i "nenalezeno") drží v paměti, než se
  # pro stejný callsign zkusí znovu -- viz adapters/qrz.py.
  # cache_ttl_seconds: 86400

# Pojmenované předvolby filtrů módů/pásem pro rychlý výběr v GUI -- čistě
# lokální pohodlí, žádný vliv na rig/AUTO TUNE mimo to, co už dělá
# POST /api/filters. Pokud sekci vynecháš, použijí se vestavěné výchozí
# předvolby (Vše/Jen SSB/Jen CW/Jen digi).
presets:
  all:
    label: "Vše"
    bands: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
    modes: ["SSB", "FT8", "FT4", "CW", "RTTY", "PSK31", "PSK63", "OTHER_DIGITAL"]
  ssb:
    label: "Jen SSB"
    bands: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
    modes: ["SSB"]
  cw:
    label: "Jen CW"
    bands: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
    modes: ["CW"]
  digi:
    label: "Jen digi"
    bands: ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
    modes: ["FT8", "FT4", "RTTY", "PSK31", "PSK63", "OTHER_DIGITAL"]

notifications:
  # Band-opening notifikace -- lokálně odvozené z počtu odlišných stanic
  # aktuálně viditelných na stejném pásmu (stejný signál jako scoring.py
  # propagation faktor). Jejich důvod využije sdílený propagation snapshot
  # z povolených NOAA URL výše; notifikační část sama síť nevolá.
  enabled: true
  # Kolik odlišných stanic na pásmu už považujeme za "otevřené pásmo".
  min_distinct_stations: 5
  # Minimální rozestup mezi opakovanými otevřeními téhož pásma.
  cooldown_minutes: 30
  # Nejvyšší počet band-opening událostí za klouzavou hodinu.
  max_per_hour: 10
